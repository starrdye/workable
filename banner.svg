<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background — same dark indigo ramp as reference -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0f172a"/>
      <stop offset="50%"  stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <!-- Title gradient — Workable indigo → violet -->
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <!-- Icon background gradient -->
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Edge glow -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Node glow — soft -->
    <filter id="nodeGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Arrowhead — neutral indigo -->
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M 0 1 L 6 3.5 L 0 6 Z" fill="#818cf8" opacity="0.65"/>
    </marker>
    <!-- Arrowhead — emerald (output edges) -->
    <marker id="arrG" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M 0 1 L 6 3.5 L 0 6 Z" fill="#34d399" opacity="0.7"/>
    </marker>
    <!-- Arrowhead — slate (tool edges) -->
    <marker id="arrS" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M 0 1 L 6 3.5 L 0 6 Z" fill="#64748B" opacity="0.55"/>
    </marker>
  </defs>

  <!-- ── Background ── -->
  <rect width="1200" height="300" fill="url(#bg)" rx="16"/>

  <!-- Ambient glow blobs — very subtle -->
  <circle cx="280"  cy="150" r="220" fill="#4F46E5" opacity="0.055"/>
  <circle cx="920"  cy="150" r="260" fill="#7C3AED" opacity="0.05"/>
  <circle cx="1140" cy="160" r="130" fill="#10B981" opacity="0.06"/>

  <!-- ────────────────────────────────────────────────
       LEFT ZONE  (x 80–540): logo + text
  ───────────────────────────────────────────────── -->

  <!-- ── W-graph logo icon (44×44 at 80,34) ── -->
  <g transform="translate(80,34)">
    <rect width="44" height="44" rx="10" fill="url(#iconBg)"/>
    <!-- W-path (scaled from 256px icon) -->
    <path d="M 8.9 12.4 L 15.1 28.9 L 22.0 18.6 L 28.9 28.9 L 35.1 12.4"
          fill="none" stroke="#C7D2FE" stroke-width="2.2" stroke-linecap="round"
          stroke-linejoin="round" opacity="0.88"/>
    <!-- Filled top nodes -->
    <circle cx="8.9"  cy="12.4" r="2.2" fill="white"/>
    <circle cx="22.0" cy="18.6" r="2.8" fill="white"/>
    <circle cx="35.1" cy="12.4" r="2.2" fill="white"/>
    <!-- Hollow bottom nodes -->
    <circle cx="15.1" cy="28.9" r="2.1" fill="none" stroke="white" stroke-width="1.6"/>
    <circle cx="28.9" cy="28.9" r="2.1" fill="none" stroke="white" stroke-width="1.6"/>
  </g>

  <!-- Brand label -->
  <text x="135" y="62" font-family="system-ui,-apple-system,sans-serif"
        font-size="17" font-weight="700" fill="white" letter-spacing="2.5" opacity="0.92">WORKABLE</text>

  <!-- Title line 1 — white -->
  <text x="82" y="138" font-family="system-ui,-apple-system,sans-serif"
        font-size="42" font-weight="700" fill="white">Personal Workflow</text>

  <!-- Title line 2 — gradient accent -->
  <text x="82" y="196" font-family="system-ui,-apple-system,sans-serif"
        font-size="56" font-weight="900" fill="url(#titleGrad)">Mapper</text>

  <!-- Tagline -->
  <text x="82" y="238" font-family="system-ui,-apple-system,sans-serif"
        font-size="16" font-weight="400" fill="#94a3b8">
    Map, analyze, and optimize any workflow with AI.
  </text>

  <!-- ────────────────────────────────────────────────
       RIGHT ZONE  (x 575–1185): workflow graph
       Nodes:
         NAV  cx=632  cy=150  r=19  external  #475569
         SC   cx=755  cy=86   r=19  tool      #64748B
         DB   cx=755  cy=214  r=19  tool      #64748B
         MA   cx=892  cy=150  r=22  person    #4F46E5  (hub)
         ED   cx=1005 cy=92   r=19  person    #4F46E5
         TCD  cx=1118 cy=150  r=22  output    #10B981
  ───────────────────────────────────────────────── -->

  <!-- ── Group box: Data Extraction (#6366F1) — NAV, SC, DB ── -->
  <rect x="596" y="46" width="202" height="212" rx="11"
        fill="#6366F1" fill-opacity="0.07" stroke="#6366F1" stroke-width="1.4" stroke-opacity="0.55"/>
  <text x="606" y="62" font-family="system-ui,sans-serif" font-size="10"
        font-weight="600" fill="#818cf8" opacity="0.9" letter-spacing="0.5">Data Extraction</text>

  <!-- ── Group box: Review & Approval (#0EA5E9) — MA, ED ── -->
  <rect x="852" y="54" width="196" height="140" rx="11"
        fill="#0EA5E9" fill-opacity="0.07" stroke="#0EA5E9" stroke-width="1.4" stroke-opacity="0.5"/>
  <text x="862" y="70" font-family="system-ui,sans-serif" font-size="10"
        font-weight="600" fill="#38bdf8" opacity="0.9" letter-spacing="0.5">Review &amp; Approval</text>

  <!-- ── Group box: Output (#10B981) — TCD ── -->
  <rect x="1078" y="108" width="92" height="90" rx="11"
        fill="#10B981" fill-opacity="0.08" stroke="#10B981" stroke-width="1.4" stroke-opacity="0.55"/>
  <text x="1088" y="124" font-family="system-ui,sans-serif" font-size="10"
        font-weight="600" fill="#34d399" opacity="0.9" letter-spacing="0.5">Output</text>

  <!-- ── Edges ── -->

  <!-- NAV → SC  (external → tool) -->
  <path d="M 649 143 Q 690 112 737 89"
        fill="none" stroke="#64748B" stroke-width="1.5"
        marker-end="url(#arrS)" opacity="0.55"/>

  <!-- NAV → DB  (external → tool) -->
  <path d="M 649 157 Q 690 188 737 211"
        fill="none" stroke="#64748B" stroke-width="1.5"
        marker-end="url(#arrS)" opacity="0.55"/>

  <!-- SC → MA  (tool → person/hub) — glowing indigo -->
  <path d="M 773 88 Q 822 108 871 146"
        fill="none" stroke="#818cf8" stroke-width="1.6"
        marker-end="url(#arr)" opacity="0.65" filter="url(#glow)"/>

  <!-- DB → MA  (tool → person/hub) — glowing indigo -->
  <path d="M 773 212 Q 822 192 871 154"
        fill="none" stroke="#818cf8" stroke-width="1.6"
        marker-end="url(#arr)" opacity="0.65" filter="url(#glow)"/>

  <!-- MA → ED  (hub → person) -->
  <path d="M 912 143 Q 954 120 987 96"
        fill="none" stroke="#818cf8" stroke-width="1.6"
        marker-end="url(#arr)" opacity="0.65" filter="url(#glow)"/>

  <!-- MA → TCD  (hub → output) — emerald -->
  <path d="M 914 150 Q 1002 152 1096 150"
        fill="none" stroke="#34d399" stroke-width="1.6"
        marker-end="url(#arrG)" opacity="0.65" filter="url(#glow)"/>

  <!-- ED → TCD  (person → output) — emerald -->
  <path d="M 1022 100 Q 1064 118 1098 143"
        fill="none" stroke="#34d399" stroke-width="1.6"
        marker-end="url(#arrG)" opacity="0.65" filter="url(#glow)"/>

  <!-- ── Nodes ── -->

  <!-- NAV — external (#475569) -->
  <circle cx="632" cy="150" r="19" fill="white" stroke="#475569" stroke-width="2"/>
  <text x="632" y="154" text-anchor="middle" font-family="system-ui,sans-serif"
        font-size="9.5" font-weight="700" fill="#475569">NAV</text>
  <text x="632" y="179" text-anchor="middle" font-family="system-ui,sans-serif"
        font-size="9" fill="#64748B">Back Office</text>

  <!-- SC — tool (#64748B) -->
  <circle cx="755" cy="86" r="19" fill="white" stroke="#64748B" stroke-width="2"/>
  <text x="755" y="90" text-anchor="middle" font-family="system-ui,sans-serif"
        font-size="9.5" font-weight="700" fill="#64748B">SC</text>
  <text x="755" y="115" text-anchor="middle" font-family="system-ui,sans-serif"
        font-size="9" fill="#64748B">Script</text>

  <!-- DB — tool (#64748B) -->
  <circle cx="755" cy="214" r="19" fill="white" stroke="#64748B" stroke-width="2"/>
  <text x="755" y="218" text-anchor="middle" font-family="system-ui,sans-serif"
        font-size="9.5" font-weight="700" fill="#64748B">DB</text>
  <text x="755" y="243" text-anchor="middle" font-family="system-ui,sans-serif"
        font-size="9" fill="#64748B">Database</text>

  <!-- MA — person hub (#4F46E5) — slightly larger, glowing -->
  <circle cx="892" cy="150" r="22" fill="white" stroke="#4F46E5" stroke-width="2.5"
          filter="url(#nodeGlow)"/>
  <text x="892" y="154" text-anchor="middle" font-family="system-ui,sans-serif"
        font-size="10" font-weight="700" fill="#4F46E5">MA</text>
  <text x="892" y="183" text-anchor="middle" font-family="system-ui,sans-serif"
        font-size="9" fill="#64748B">Mary</text>

  <!-- ED — person (#4F46E5) -->
  <circle cx="1005" cy="92" r="19" fill="white" stroke="#4F46E5" stroke-width="2"/>
  <text x="1005" y="96" text-anchor="middle" font-family="system-ui,sans-serif"
        font-size="9.5" font-weight="700" fill="#4F46E5">ED</text>
  <text x="1005" y="121" text-anchor="middle" font-family="system-ui,sans-serif"
        font-size="9" fill="#64748B">Edward</text>

  <!-- TCD — output (#10B981) — larger, glowing -->
  <circle cx="1118" cy="150" r="22" fill="white" stroke="#10B981" stroke-width="2.5"
          filter="url(#nodeGlow)"/>
  <text x="1118" y="154" text-anchor="middle" font-family="system-ui,sans-serif"
        font-size="9.5" font-weight="700" fill="#10B981">TCD</text>
  <text x="1118" y="183" text-anchor="middle" font-family="system-ui,sans-serif"
        font-size="9" fill="#64748B">Dashboard</text>

</svg>
